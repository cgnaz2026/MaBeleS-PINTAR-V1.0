    function stripHyphens(text) {
        if (!text) return '';
        return text.replace(/--/g, ' ~ ').replace(/-/g, '').replace(/ ~ /g, '-');
    }

    /* Menterjemah Teks Sengkang Kepada HTML Berwarna Suku Kata */
    function renderColoredHyphenatedText(hyphenatedText) {
        if (!hyphenatedText) return '';
        const colors = ['syl-c1', 'syl-c2', 'syl-c3', 'syl-c4'];
        const words = hyphenatedText.split(' ');

        return words.map(word => {
            if (word.includes('--')) {
                let parts = word.split('--');
                let coloredParts = parts.map(part => {
                    let match = part.match(/^([a-zA-Z\u00C0-\u024F\-]+)(.*)$/);
                    if (match) {
                        let sylls = match[1].split('-');
                        let punct = match[2];
                        let coloredSylls = sylls.map((syl, idx) => `<span class="${colors[idx % colors.length]}">${syl}</span>`).join('');
                        return coloredSylls + punct;
                    }
                    return part;
                });
                return coloredParts.join('-');
            } else if (word.includes('-')) {
                let match = word.match(/^([a-zA-Z\u00C0-\u024F\-]+)(.*)$/);
                if (match) {
                    let sylls = match[1].split('-');
                    let punct = match[2];
                    let coloredSylls = sylls.map((syl, idx) => `<span class="${colors[idx % colors.length]}">${syl}</span>`).join('');
                    return coloredSylls + punct;
                }
            }
            return `<span class="syl-c1">${word}</span>`;
        }).join(' ');
    }

    /* FUNGSI MENGHENTIKAN SEMUA AUDIO & MENGEMBALIKAN BUTANG KE STATUS ASAL */
    function stopAllAudio() {
        isPlayingPassage = false;
        currentPassageList = [];
        currentPassageIdx = 0;
        currentPlayingId = null;

        if (activeSpeakerBtnEl) {
            activeSpeakerBtnEl.classList.remove('playing');
            activeSpeakerBtnEl.innerText = '🔊';
            activeSpeakerBtnEl = null;
        }

        if (passageTimer) {
            clearTimeout(passageTimer);
            passageTimer = null;
        }

        try {
            passageAudio.pause();
            passageAudio.currentTime = 0;
            passageAudio.onended = null;
            passageAudio.onerror = null;
        } catch(e) {}

        try {
            singleAudioPlayer.pause();
            singleAudioPlayer.currentTime = 0;
            singleAudioPlayer.onended = null;
            singleAudioPlayer.onerror = null;
        } catch(e) {}

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }

    function initAudioContext() {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
                audioCtx = new AudioContextClass();
            }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function unlockAudioEngine() {
        if (!isAudioUnlocked) {
            initAudioContext();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.resume();
            }
            isAudioUnlocked = true;
        }
    }
    document.addEventListener('click', unlockAudioEngine, { passive: true });
    document.addEventListener('touchstart', unlockAudioEngine, { passive: true });

    /* ENJIN PEMBACAAN PETIKAN PEMAHAMAN PENUH KEMAHIRAN 9 */
    function playLongPassageProcess(hyphenatedText) {
        let plainText = stripHyphens(hyphenatedText);

        let sentences = plainText.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.length > 0);

        if (sentences.length === 0) {
            stopAllAudio();
            return;
        }

        currentPassageList = sentences;
        currentPassageIdx = 0;
        isPlayingPassage = true;

        playSentenceAtIndex(0);
    }

    function playSentenceAtIndex(index) {
        if (!isPlayingPassage || index >= currentPassageList.length) {
            stopAllAudio();
            return;
        }

        currentPassageIdx = index;
        let text = currentPassageList[index];

        let encoded = encodeURIComponent(text);
        let url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ms&q=${encoded}`;

        passageAudio.pause();
        passageAudio.src = url;
        passageAudio.currentTime = 0;

        passageAudio.onended = function() {
            if (!isPlayingPassage) return;
            setTimeout(() => {
                if (isPlayingPassage) {
                    playSentenceAtIndex(index + 1);
                }
            }, 200);
        };

        passageAudio.onerror = function() {
            if (!isPlayingPassage) return;
            setTimeout(() => {
                if (isPlayingPassage) {
                    playSentenceAtIndex(index + 1);
                }
            }, 300);
        };

        let p = passageAudio.play();
        if (p !== undefined) {
            p.catch(() => {
                fallbackWebSpeech(text, () => {
                    if (isPlayingPassage) {
                        setTimeout(() => playSentenceAtIndex(index + 1), 200);
                    }
                });
            });
        }
    }

    /* Pembacaan Satu Ayat / Perkataan Ringkas */
    function speakTextProcess(text) {
        let cleanText = stripHyphens(text).trim();

        let encoded = encodeURIComponent(cleanText);
        let onlineUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ms&q=${encoded}`;

        singleAudioPlayer.src = onlineUrl;
        singleAudioPlayer.playbackRate = 0.88;

        singleAudioPlayer.onended = function() {
            stopAllAudio();
        };

        singleAudioPlayer.onerror = function() {
            fallbackWebSpeech(cleanText, () => {
                stopAllAudio();
            });
        };

        let p = singleAudioPlayer.play();
        if (p !== undefined) {
            p.catch(() => {
                fallbackWebSpeech(cleanText, () => {
                    stopAllAudio();
                });
            });
        }
    }

    function fallbackWebSpeech(text, onEndCb) {
        if (!('speechSynthesis' in window)) {
            if (onEndCb) onEndCb();
            return;
        }
        window.speechSynthesis.resume();
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();

        let msVoice = voices.find(v => (v.lang === 'ms-MY' || v.lang === 'ms_MY' || v.lang.startsWith('ms')) && !v.lang.toLowerCase().includes('id'));
        if (msVoice) {
            utterance.voice = msVoice;
        }
        utterance.lang = 'ms-MY';
        utterance.rate = 0.85;

        utterance.onend = function() {
            if (onEndCb) onEndCb();
        };
        utterance.onerror = function() {
            if (onEndCb) onEndCb();
        };

        window.speechSynthesis.speak(utterance);
    }

    /* Fungsi Audio Mengeja Dan Menyebut Bagi Kemahiran 2 hingga 7 */
    function spellAndSayWordProcess(word, syllables) {
        if (!syllables || !Array.isArray(syllables) || syllables.length === 0) {
            let spelled = word.split('').join(', ') + `, ${word}`;
            speakTextProcess(spelled);
            return;
        }

        let parts = [];
        syllables.forEach(syl => {
            if (syl.length === 1) {
                parts.push(syl);
            } else {
                let letters = syl.split('').join(', ');
                parts.push(`${letters}, ${syl}`);
            }
        });

        let fullSpellingString = `${parts.join('. ')}. ${word}.`;
        speakTextProcess(fullSpellingString);
    }

    /* Web Audio Sound FX */
    function playBeep(type) {
        initAudioContext();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    /* Enjin Muzik Latar Belakang Ceria */
    function toggleBackgroundMusic() {
        unlockAudioEngine();
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        isMusicPlaying = !isMusicPlaying;
        const btn = document.getElementById('musicToggle');
        const btnText = document.getElementById('musicBtnText');
        const visualizer = document.getElementById('musicVisualizer');

        if (isMusicPlaying) {
            btn.classList.add('playing');
            btnText.innerText = 'Main';
            visualizer.style.display = 'inline-flex';
            startMelody();
        } else {
            btn.classList.remove('playing');
            btnText.innerText = 'Muzik';
            visualizer.style.display = 'none';
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        }
    }

    function startMelody() {
        if (musicInterval) clearInterval(musicInterval);

        const sequence = [
            261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 349.23, 440.00, 523.25
        ];
        let step = 0;

        playMelodyNote();

        musicInterval = setInterval(() => {
            if (!isMusicPlaying) return;
            playMelodyNote();
        }, 320);

        function playMelodyNote() {
            if (!audioCtx) initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            try {
                const freq = sequence[step];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.28);

                step = (step + 1) % sequence.length;
            } catch(e) {}
        }
    }

    function triggerConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ['#FF5722', '#4CAF50', '#FFEB3B', '#2196F3', '#E91E63'];

        for (let i = 0; i < 50; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.7) * 12,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;

            particles.forEach(p => {
                if (p.alpha > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.alpha -= 0.02;

                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            if (active) requestAnimationFrame(render);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        render();
    }
